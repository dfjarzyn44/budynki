<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    
    .grid { 
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 15px; margin-bottom: 25px; height: 180px; overflow-y: auto; 
      border: 1px solid #ddd; padding: 10px; background: #fff; border-radius: 8px; 
    }
    .card { background: white; border: 2px solid #ddd; padding: 10px; text-align: center; cursor: pointer; }
    .card img { width: 100%; height: 80px; object-fit: cover; }

    /* OKNO PODGLĄDU */
    .stage-wrapper {
      width: 100%;
      height: 600px;
      border: 2px solid #bbb;
      background: #ffffff;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
    }
    
    /* PŁÓTNO - KLUCZ DO NAPRAWY */
    #stage { 
      display: flex; 
      align-items: flex-end; /* Budynki lądują na dole */
      justify-content: flex-start; 
      gap: 30px; 
      padding: 0 30px 20px 30px;
      width: max-content; /* Szerokość dostosowuje się do zawartości */
      min-width: 100%;    /* Minimum szerokość okna */
      min-height: 100%;   /* Minimum wysokość okna */
      
      /* Trawa na samym dole */
      background: linear-gradient(to bottom, transparent calc(100% - 20px), #4CAF50 calc(100% - 20px), #2e7d32 100%);
      background-repeat: no-repeat;
      
      transform-origin: 0 0;
      position: absolute; /* Potrzebne do pan/zoom */
      top: 0;
      left: 0;
      will-change: transform;
    }
    
    .building-item { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; position: relative; }
    .building-item img { display: block; height: auto; pointer-events: none; }
    
    .remove-btn { position: absolute; top: -55px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
    .building-info { margin-bottom: 6px; font-size: 12px; background: rgba(255,255,255,0.9); padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-wrapper" id="stageWrapper">
    <div id="stage"></div>
  </div>

  <script>
    let currentZoom = 1, panX = 0, panY = 0;
    const stage = document.getElementById('stage');
    const wrapper = document.getElementById('stageWrapper');

    // ZOOM NA KURSOR
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomStep = 0.1;
      const factor = e.deltaY < 0 ? (1 + zoomStep) : (1 / (1 + zoomStep));
      const newZoom = Math.min(Math.max(currentZoom * factor, 0.1), 3);
      
      const rect = wrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newZoom / currentZoom);
      panY = mouseY - (mouseY - panY) * (newZoom / currentZoom);
      currentZoom = newZoom;
      updateTransform();
    }, { passive: false });

    // PANNING
    let isDown = false, startX, startY;
    wrapper.addEventListener('mousedown', (e) => {
      if (e.target.closest('.remove-btn')) return;
      isDown = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });
    window.addEventListener('mouseup', () => isDown = false);
    wrapper.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    function updateTransform() {
      stage.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    }

    // Dodawanie budynków
    function addToStage(building) {
      const item = document.createElement('div');
      item.className = 'building-item';
      item.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
        <div class="building-info"><strong>${building.name}</strong></div>
        <img src="${building.image_2d}" alt="${building.name}">
      `;
      stage.appendChild(item);
    }
  </script>
</body>
</html>
