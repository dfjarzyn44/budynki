<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background-color: #f4f4f9; 
      color: #333; 
    }
    h1 { text-align: center; }
    
    .controls { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      margin-bottom: 20px; 
      justify-content: center; 
    }
    input, select { 
      padding: 10px; 
      font-size: 16px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 15px; 
      margin-bottom: 25px; 
      height: 250px; 
      overflow-y: auto; 
      border: 1px solid #ddd; 
      padding: 10px; 
      background: #fff; 
      border-radius: 8px; 
    }
    .card { 
      background: white; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      padding: 10px; 
      text-align: center; 
      cursor: pointer; 
    }
    .card:hover { border-color: #007bff; }
    .card img { 
      width: 100%; 
      height: 90px; 
      object-fit: cover; 
      border-radius: 5px; 
      background-color: #eee; 
    }
    .card h3 { margin: 8px 0 0 0; font-size: 13px; }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .zoom-controls button {
      padding: 4px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #bbb;
      background: #f0f0f0;
      border-radius: 4px;
    }
    .zoom-controls button:hover { background: #e0e0e0; }

    /* Wyższe okno podglądu (800px) */
    .stage-wrapper {
      width: 100%;
      height: 800px;
      border: 2px solid #bbb;
      border-radius: 8px;
      background: #ffffff;
      overflow: auto;
      position: relative;
    }

    /* Trawnik dociągnięty do samego dołu i szeroki na całą zawartość */
    #stage { 
      display: flex; 
      align-items: flex-end; 
      justify-content: flex-start; 
      gap: 30px; 
      width: max-content;
      min-width: 100%;
      min-height: 100%;
      padding: 50px 30px 0px 30px; 
      box-sizing: border-box;
      background: linear-gradient(to bottom, #ffffff calc(100% - 20px), #4CAF50 calc(100% - 20px), #2e7d32 100%);
      transform-origin: bottom left;
      transition: transform 0.1s ease-out;
    }
    
    .building-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      flex-shrink: 0; 
      position: relative;
      margin-bottom: 20px; /* Obrazek dotyka gruntu */
    }
    
    .building-item img { 
      display: block !important; 
      height: auto !important; 
      max-height: none !important; 
      width: auto !important; 
      max-width: none !important; 
    }
    
    .remove-btn {
      position: absolute;
      top: -35px;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .remove-btn:hover { background: #cc0000; }
    
    /* Podpis nad obrazkiem, aby budynek nie lewitował */
    .building-info { 
      margin-bottom: 6px; 
      font-size: 12px; 
      text-align: center; 
      background: rgba(255, 255, 255, 0.95); 
      padding: 3px 6px; 
      border-radius: 4px; 
      border: 1px solid #ccc;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>Building Size Comparison</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search building...">
    <select id="categoryFilter"><option value="">All Categories</option></select>
    <select id="countryFilter"><option value="">All Countries</option></select>
  </div>

  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-header">
    <h2>Comparison Area</h2>
    <div class="zoom-controls">
      <label for="zoomRange"><strong>Scale:</strong></label>
      <button onclick="changeZoom(-0.1)">−</button>
      <input type="range" id="zoomRange" min="0.05" max="2" step="0.05" value="1" oninput="setZoom(this.value)">
      <button onclick="changeZoom(0.1)">+</button>
      <span id="zoomVal">100%</span>
      <button onclick="setZoom(1)">100%</button>
    </div>
  </div>

  <div class="stage-wrapper">
    <div id="stage"></div>
  </div>

  <script>
    let buildingsData = [];
    let currentZoom = 1;

    async function loadBuildings() {
      try {
        const response = await fetch('budynki.json');
        buildingsData = await response.json();
        setupFilters();
        renderGrid(buildingsData);
      } catch (e) {
        console.error("Error loading JSON:", e);
      }
    }

    function setupFilters() {
      const categories = [...new Set(buildingsData.map(b => b.category))];
      const countries = [...new Set(buildingsData.map(b => b.country))];
      const catSelect = document.getElementById('categoryFilter');
      categories.forEach(cat => catSelect.innerHTML += `<option value="${cat}">${cat}</option>`);
      const countSelect = document.getElementById('countryFilter');
      countries.forEach(c => countSelect.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderGrid(data) {
      const grid = document.getElementById('buildingsGrid');
      grid.innerHTML = '';
      data.forEach(b => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => addToStage(b);
        card.innerHTML = `<img src="${b.thumbnail}" alt="${b.name}"><h3>${b.name}</h3>`;
        grid.appendChild(card);
      });
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const count = document.getElementById('countryFilter').value;
      renderGrid(buildingsData.filter(b => 
        (b.name.toLowerCase().includes(search)) && (cat === '' || b.category === cat) && (count === '' || b.country === count)
      ));
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('countryFilter').addEventListener('change', filterData);

    function addToStage(building) {
      const stage = document.getElementById('stage');
      const item = document.createElement('div');
      item.className = 'building-item';

      item.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()" title="Remove building">✕</button>
        <div class="building-info"><strong>${building.name}</strong></div>
        <img src="${building.image_2d}" alt="${building.name}">
      `;
      stage.appendChild(item);
    }

    function setZoom(val) {
      currentZoom = parseFloat(val);
      if (currentZoom < 0.05) currentZoom = 0.05;
      if (currentZoom > 2) currentZoom = 2;
      
      document.getElementById('zoomRange').value = currentZoom;
      document.getElementById('zoomVal').innerText = Math.round(currentZoom * 100) + '%';
      document.getElementById('stage').style.transform = `scale(${currentZoom})`;
    }

    function changeZoom(delta) {
      setZoom(currentZoom + delta);
    }

    loadBuildings();
  </script>
</body>
</html>
