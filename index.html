<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    body.no-scroll { overflow: hidden; }

    h1 { text-align: center; }
    
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
    input, select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
    
    .grid { 
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 15px; margin-bottom: 25px; height: 200px; overflow-y: auto; 
      border: 1px solid #ddd; padding: 10px; background: #fff; border-radius: 8px; 
    }
    .card { background: white; border: 2px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
    .card:hover { border-color: #007bff; }
    .card img { width: 100%; height: 90px; object-fit: cover; border-radius: 5px; background-color: #eee; }
    .card h3 { margin: 8px 0 0 0; font-size: 13px; }

    .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .zoom-controls { display: flex; gap: 10px; align-items: center; background: #fff; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; }
    
    .btn-action { background: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-action:hover { background: #0056b3; }

    /* OKNO PODGLĄDU */
    .stage-wrapper {
      width: 100%;
      height: 450px;
      border: 2px solid #bbb;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
      position: relative;
      user-select: none;
      touch-action: pan-y;
    }

    /* TRYB PEŁNOEKRANOWY (DYNAMICZNY) */
    .stage-wrapper.fullscreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 9999;
      border: none;
      border-radius: 0;
      touch-action: none;
      cursor: grab;
    }
    .stage-wrapper.fullscreen:active { cursor: grabbing; }

    .close-fullscreen-btn {
      display: none;
      position: absolute;
      top: 15px; right: 15px;
      z-index: 10000;
      background: #ff4d4d; color: white;
      border: none; padding: 10px 18px;
      border-radius: 6px; font-weight: bold; font-size: 16px;
      cursor: pointer;
    }
    .stage-wrapper.fullscreen .close-fullscreen-btn { display: block; }

    /* PŁÓTNO */
    #stage { 
      display: flex; 
      align-items: flex-end; 
      justify-content: flex-start; 
      gap: 30px; 
      padding: 20px 30px;
      box-sizing: border-box;
      min-width: 100%;
      width: max-content;
      background: linear-gradient(to bottom, transparent calc(100% - 20px), #4CAF50 calc(100% - 20px), #2e7d32 100%);
      transform-origin: 0 0;
      position: absolute; 
      top: 0; left: 0;
    }
    
    .building-item { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; position: relative; }
    .building-item img { display: block; height: auto; width: auto; pointer-events: none; }
    
    .remove-btn {
      position: absolute; top: -55px; background: #ff4d4d; color: white; border: none; border-radius: 50%;
      width: 48px; height: 48px; font-size: 26px; cursor: pointer; z-index: 10;
    }
    .building-info { 
      margin-bottom: 6px; font-size: 12px; text-align: center; background: rgba(255,255,255,0.95); 
      padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>Building Size Comparison</h1>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search building...">
    <select id="categoryFilter"><option value="">All Categories</option></select>
    <select id="countryFilter"><option value="">All Countries</option></select>
  </div>
  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-header">
    <h2>Comparison Area</h2>
    <div class="zoom-controls">
      <button class="btn-action" id="toggleFsBtn" onclick="toggleFullscreen()">🔍 Otwórz interaktywne płótno</button>
      <span>Skala: <strong id="zoomVal">100%</strong></span>
      <button onclick="fitToStage()">Reset</button>
    </div>
  </div>

  <div class="stage-wrapper" id="stageWrapper">
    <button class="close-fullscreen-btn" onclick="toggleFullscreen()">✕ Zamknij pełny ekran</button>
    <div id="stage"></div>
  </div>

  <script>
    let buildingsData = [], currentZoom = 1, panX = 0, panY = 0;
    let isFullscreen = false;
    
    let stageDim = { wrapperW: 0, wrapperH: 0, stageW: 0, stageH: 0 };
    let ticking = false;

    async function loadData() {
      try {
        const response = await fetch('budynki.json');
        buildingsData = await response.json();
        renderGrid(buildingsData);
        setupFilters();
        initInteractions();
      } catch (e) {
        console.error("Błąd ładowania JSON:", e);
      }
    }

    function updateDimensionsCache() {
      const wrapper = document.getElementById('stageWrapper');
      const stage = document.getElementById('stage');
      stageDim.wrapperW = wrapper.clientWidth;
      stageDim.wrapperH = wrapper.clientHeight;
      stageDim.stageW = stage.scrollWidth;
      stageDim.stageH = stage.offsetHeight;
    }

    function toggleFullscreen() {
      const wrapper = document.getElementById('stageWrapper');
      const btn = document.getElementById('toggleFsBtn');
      
      isFullscreen = !isFullscreen;
      
      if (isFullscreen) {
        wrapper.classList.add('fullscreen');
        document.body.classList.add('no-scroll');
        btn.innerText = "✕ Wyjdź z płótna";
      } else {
        wrapper.classList.remove('fullscreen');
        document.body.classList.remove('no-scroll');
        btn.innerText = "🔍 Otwórz interaktywne płótno";
      }
      
      fitToStage();
    }

    function updateStageHeight() {
      const wrapper = document.getElementById('stageWrapper');
      const stage = document.getElementById('stage');
      const buildingItems = stage.querySelectorAll('.building-item');

      let maxBHeight = 0;
      buildingItems.forEach(item => {
        if (item.offsetHeight > maxBHeight) {
          maxBHeight = item.offsetHeight;
        }
      });

      const wrapperH = wrapper.clientHeight;
      const neededH = maxBHeight > 0 ? (maxBHeight + 500) : wrapperH;
      stage.style.height = neededH + 'px';
    }

    function clampPan() {
      const { wrapperW, wrapperH, stageW, stageH } = stageDim;
      const scaledH = stageH * currentZoom;
      const scaledW = stageW * currentZoom;

      // BLOKADA PIONOWA (Trawa u dołu)
      if (scaledH <= wrapperH) {
        panY = wrapperH - scaledH;
      } else {
        const minPanY = wrapperH - scaledH;
        panY = Math.min(0, Math.max(minPanY, panY));
      }

      // BLOKADA POZIOMA (Budynki od lewej)
      if (scaledW <= wrapperW) {
        panX = 0;
      } else {
        const minPanX = wrapperW - scaledW;
        panX = Math.min(0, Math.max(minPanX, panX));
      }
    }

    function applyTransform() {
      if (!ticking) {
        requestAnimationFrame(() => {
          clampPan();
          document.getElementById('zoomVal').innerText = Math.round(currentZoom * 100) + '%';
          document.getElementById('stage').style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${currentZoom})`;
          ticking = false;
        });
        ticking = true;
      }
    }

    function initInteractions() {
      const wrapper = document.getElementById('stageWrapper');

      // ZOOM MYSZY (Inkrementalny)
      wrapper.addEventListener('wheel', (e) => {
        if (!isFullscreen) return;
        e.preventDefault();
        
        const zoomStep = 0.1;
        const factor = e.deltaY < 0 ? (1 + zoomStep) : (1 / (1 + zoomStep));
        const newZoom = Math.min(Math.max(currentZoom * factor, 0.05), 5);
        const actualFactor = newZoom / currentZoom;
        
        const rect = wrapper.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        panX = mouseX - (mouseX - panX) * actualFactor;
        panY = mouseY - (mouseY - panY) * actualFactor;
        currentZoom = newZoom;
        applyTransform();
      }, { passive: false });

      // PANNING MYSZY
      let isDown = false, startX, startY;
      wrapper.addEventListener('mousedown', (e) => {
        if (!isFullscreen || e.target.closest('.remove-btn')) return;
        isDown = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });
      window.addEventListener('mouseup', () => isDown = false);
      wrapper.addEventListener('mousemove', (e) => {
        if (!isDown || !isFullscreen) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
      });

      // OBSŁUGA DOTYKU (Płynny Pinch-to-zoom + Pan)
      let lastTouchDist = 0;

      wrapper.addEventListener('touchstart', (e) => {
        if (!isFullscreen) return;
        
        if (e.touches.length === 1) {
          isDown = true;
          startX = e.touches[0].clientX - panX;
          startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
          isDown = false;
          lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      wrapper.addEventListener('touchmove', (e) => {
        if (!isFullscreen) return;
        const rect = wrapper.getBoundingClientRect();

        if (e.touches.length === 1 && isDown) {
          panX = e.touches[0].clientX - startX;
          panY = e.touches[0].clientY - startY;
          applyTransform();
        } else if (e.touches.length === 2 && lastTouchDist > 0) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (currentDist === 0) return;

          const factor = currentDist / lastTouchDist;
          const newZoom = Math.min(Math.max(currentZoom * factor, 0.05), 5);
          const actualFactor = newZoom / currentZoom;

          const currentMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
          const currentMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;

          panX = currentMidX - (currentMidX - panX) * actualFactor;
          panY = currentMidY - (currentMidY - panY) * actualFactor;

          currentZoom = newZoom;
          lastTouchDist = currentDist;
          applyTransform();
        }
      }, { passive: true });

      wrapper.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          lastTouchDist = 0;
        }
        // Płynny powrót do gestu 1 palca po oderwaniu drugiego
        if (e.touches.length === 1) {
          isDown = true;
          startX = e.touches[0].clientX - panX;
          startY = e.touches[0].clientY - panY;
        } else {
          isDown = false;
        }
      });

      window.addEventListener('resize', () => fitToStage());
    }

    function fitToStage() {
      updateStageHeight();
      updateDimensionsCache();

      const stage = document.getElementById('stage');
      const buildingItems = stage.querySelectorAll('.building-item');
      
      if (buildingItems.length === 0) {
        currentZoom = 1;
        panX = 0;
        panY = 0;
        applyTransform();
        return;
      }

      const scaleX = stageDim.wrapperW / stageDim.stageW;
      const scaleY = stageDim.wrapperH / stageDim.stageH;

      currentZoom = Math.min(scaleX, scaleY, 1);

      panX = 0;
      panY = stageDim.wrapperH - (stageDim.stageH * currentZoom);
      applyTransform();
    }

    function addToStage(building) {
      const stage = document.getElementById('stage');
      const item = document.createElement('div');
      item.className = 'building-item';
      item.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove(); fitToStage();">✕</button>
        <div class="building-info"><strong>${building.name}</strong></div>
        <img src="${building.image_2d}" alt="${building.name}" decoding="async">
      `;
      
      const img = item.querySelector('img');
      img.onload = () => fitToStage();
      
      stage.appendChild(item);
      fitToStage();
    }

    function renderGrid(data) {
      const grid = document.getElementById('buildingsGrid');
      grid.innerHTML = '';
      data.forEach(b => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => addToStage(b);
        card.innerHTML = `<img src="${b.thumbnail}" alt="${b.name}" decoding="async"><h3>${b.name}</h3>`;
        grid.appendChild(card);
      });
    }

    function setupFilters() {
      const catSelect = document.getElementById('categoryFilter');
      const countrySelect = document.getElementById('countryFilter');
      
      const categories = [...new Set(buildingsData.map(b => b.category))].filter(Boolean);
      const countries = [...new Set(buildingsData.map(b => b.country))].filter(Boolean);

      catSelect.innerHTML = '<option value="">All Categories</option>';
      categories.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

      countrySelect.innerHTML = '<option value="">All Countries</option>';
      countries.forEach(c => countrySelect.innerHTML += `<option value="${c}">${c}</option>`);

      document.getElementById('searchInput').addEventListener('input', filterData);
      catSelect.addEventListener('change', filterData);
      countrySelect.addEventListener('change', filterData);
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const country = document.getElementById('countryFilter').value;

      const filtered = buildingsData.filter(b => {
        const matchSearch = b.name.toLowerCase().includes(search);
        const matchCat = !cat || b.category === cat;
        const matchCountry = !country || b.country === country;
        return matchSearch && matchCat && matchCountry;
      });

      renderGrid(filtered);
    }

    loadData();
  </script>
</body>
</html>
