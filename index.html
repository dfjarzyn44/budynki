<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background-color: #f4f4f9; 
      color: #333; 
    }
    h1 { text-align: center; }
    
    .controls { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      margin-bottom: 20px; 
      justify-content: center; 
    }
    input, select { 
      padding: 10px; 
      font-size: 16px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 15px; 
      margin-bottom: 25px; 
      height: 200px; 
      overflow-y: auto; 
      border: 1px solid #ddd; 
      padding: 10px; 
      background: #fff; 
      border-radius: 8px; 
    }
    .card { 
      background: white; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      padding: 10px; 
      text-align: center; 
      cursor: pointer; 
    }
    .card:hover { border-color: #007bff; }
    .card img { 
      width: 100%; 
      height: 90px; 
      object-fit: cover; 
      border-radius: 5px; 
      background-color: #eee; 
    }
    .card h3 { margin: 8px 0 0 0; font-size: 13px; }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .zoom-controls button {
      padding: 4px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #bbb;
      background: #f0f0f0;
      border-radius: 4px;
    }
    .zoom-controls button:hover { background: #e0e0e0; }

    /* DUŻE PŁÓTNO BEZ SUWAKÓW */
    .stage-wrapper {
      width: 100%;
      height: 850px; 
      min-height: 75vh;
      border: 2px solid #bbb;
      border-radius: 8px;
      background: #ffffff;
      overflow: auto;
      position: relative;
      cursor: grab;
      user-select: none;

      /* Ukrycie suwaków */
      scrollbar-width: none; 
      -ms-overflow-style: none; 
    }
    .stage-wrapper::-webkit-scrollbar {
      display: none; 
    }
    
    .stage-wrapper:active {
      cursor: grabbing;
    }

    #stage { 
      display: flex; 
      align-items: flex-end; 
      justify-content: flex-start; 
      gap: 30px; 
      width: max-content;
      min-width: 100%;
      min-height: 100%;
      padding: 70px 30px 20px 30px;
      box-sizing: border-box;
      background: linear-gradient(to bottom, #ffffff calc(100% - 20px), #4CAF50 calc(100% - 20px), #2e7d32 100%);
      transform-origin: top left; /* Zmiana punktu odniesienia skalowania */
      /* Usunięto transition, by zoom działał płynnie bez opóźnień skrolowania */
    }
    
    .building-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      flex-shrink: 0; 
      position: relative;
    }
    
    .building-item img { 
      display: block !important; 
      height: auto !important; 
      max-height: none !important; 
      width: auto !important; 
      max-width: none !important; 
      pointer-events: none;
    }
    
    .remove-btn {
      position: absolute;
      top: -55px;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .remove-btn:hover { background: #cc0000; }
    
    .building-info { 
      margin-bottom: 6px; 
      font-size: 12px; 
      text-align: center; 
      background: rgba(255, 255, 255, 0.95); 
      padding: 3px 6px; 
      border-radius: 4px; 
      border: 1px solid #ccc;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>Building Size Comparison</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search building...">
    <select id="categoryFilter"><option value="">All Categories</option></select>
    <select id="countryFilter"><option value="">All Countries</option></select>
  </div>

  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-header">
    <h2>Comparison Area</h2>
    <div class="zoom-controls">
      <label><strong>Scale:</strong></label>
      <span id="zoomVal">100%</span>
      <button onclick="setZoom(1)">Reset 100%</button>
    </div>
  </div>

  <div class="stage-wrapper" id="stageWrapper">
    <div id="stage"></div>
  </div>

  <script>
    let buildingsData = [];
    let currentZoom = 1;

    async function loadData() {
      try {
        const response = await fetch('budynki.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        buildingsData = await response.json();
        initApp();
      } catch (error) {
        console.error("Błąd podczas ładowania pliku JSON:", error);
      }
    }

    function initApp() {
      setupFilters();
      renderGrid(buildingsData);
      setupScrollZoom();
      setupPan();
    }

    function setupFilters() {
      const categories = [...new Set(buildingsData.map(b => b.category))];
      const countries = [...new Set(buildingsData.map(b => b.country))];
      
      const catSelect = document.getElementById('categoryFilter');
      catSelect.innerHTML = '<option value="">All Categories</option>';
      categories.forEach(cat => catSelect.innerHTML += `<option value="${cat}">${cat}</option>`);
      
      const countSelect = document.getElementById('countryFilter');
      countSelect.innerHTML = '<option value="">All Countries</option>';
      countries.forEach(c => countSelect.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderGrid(data) {
      const grid = document.getElementById('buildingsGrid');
      grid.innerHTML = '';
      data.forEach(b => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => addToStage(b);
        card.innerHTML = `<img src="${b.thumbnail}" alt="${b.name}"><h3>${b.name}</h3>`;
        grid.appendChild(card);
      });
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const count = document.getElementById('countryFilter').value;
      renderGrid(buildingsData.filter(b => 
        (b.name.toLowerCase().includes(search)) && (cat === '' || b.category === cat) && (count === '' || b.country === count)
      ));
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('countryFilter').addEventListener('change', filterData);

    function addToStage(building) {
      const stage = document.getElementById('stage');
      const item = document.createElement('div');
      item.className = 'building-item';

      item.innerHTML = `
        <button class="remove-btn" onclick="removeItem(this)" title="Remove building">✕</button>
        <div class="building-info"><strong>${building.name}</strong></div>
        <img src="${building.image_2d}" alt="${building.name}">
      `;
      
      stage.appendChild(item);
    }

    function removeItem(btn) {
      btn.parentElement.remove();
    }

    // Zoom nakierowany bezpośrednio na kursor myszy
    function setupScrollZoom() {
      const wrapper = document.getElementById('stageWrapper');
      const stage = document.getElementById('stage');
      
      wrapper.addEventListener('wheel', (e) => {
        e.preventDefault(); 
        
        const zoomStep = 0.08; 
        const oldZoom = currentZoom;
        let newZoom = e.deltaY < 0 ? oldZoom * (1 + zoomStep) : oldZoom / (1 + zoomStep);
        
        if (newZoom < 0.05) newZoom = 0.05;
        if (newZoom > 3) newZoom = 3;
        if (newZoom === oldZoom) return;

        // Pozycja myszy względem ramki obszaru roboczego
        const rect = wrapper.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const scrollLeft = wrapper.scrollLeft;
        const scrollTop = wrapper.scrollTop;
        const ratio = newZoom / oldZoom;

        // Aplikacja nowej skali
        currentZoom = newZoom;
        document.getElementById('zoomVal').innerText = Math.round(currentZoom * 100) + '%';
        stage.style.transform = `scale(${currentZoom})`;

        // Przesunięcie widoku tak, aby kursor pozostał w tym samym miejscu obiektu
        wrapper.scrollLeft = (scrollLeft + mouseX) * ratio - mouseX;
        wrapper.scrollTop = (scrollTop + mouseY) * ratio - mouseY;
      }, { passive: false });
    }

    function setupPan() {
      const wrapper = document.getElementById('stageWrapper');
      let isDown = false;
      let startX, startY, scrollLeft, scrollTop;

      wrapper.addEventListener('mousedown', (e) => {
        if (e.target.closest('.remove-btn')) return;

        isDown = true;
        startX = e.pageX - wrapper.offsetLeft;
        startY = e.pageY - wrapper.offsetTop;
        scrollLeft = wrapper.scrollLeft;
        scrollTop = wrapper.scrollTop;
      });

      wrapper.addEventListener('mouseleave', () => { isDown = false; });
      wrapper.addEventListener('mouseup', () => { isDown = false; });

      wrapper.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - wrapper.offsetLeft;
        const y = e.pageY - wrapper.offsetTop;
        const walkX = (x - startX) * 1.5;
        const walkY = (y - startY) * 1.5;
        wrapper.scrollLeft = scrollLeft - walkX;
        wrapper.scrollTop = scrollTop - walkY;
      });
    }

    function setZoom(val) {
      currentZoom = parseFloat(val);
      if (currentZoom < 0.05) currentZoom = 0.05;
      if (currentZoom > 3) currentZoom = 3;
      
      document.getElementById('zoomVal').innerText = Math.round(currentZoom * 100) + '%';
      document.getElementById('stage').style.transform = `scale(${currentZoom})`;
    }

    loadData();
  </script>
</body>
</html>
