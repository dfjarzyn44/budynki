<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background-color: #f4f4f9; 
      color: #333; 
    }
    h1 { text-align: center; }
    
    .controls { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      margin-bottom: 20px; 
      justify-content: center; 
    }
    input, select { 
      padding: 10px; 
      font-size: 16px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 15px; 
      margin-bottom: 25px; 
      height: 250px; 
      overflow-y: auto; 
      border: 1px solid #ddd; 
      padding: 10px; 
      background: #fff; 
      border-radius: 8px; 
    }
    .card { 
      background: white; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      padding: 10px; 
      text-align: center; 
      cursor: pointer; 
    }
    .card:hover { border-color: #007bff; }
    .card img { 
      width: 100%; 
      height: 90px; 
      object-fit: cover; 
      border-radius: 5px; 
      background-color: #eee; 
    }
    .card h3 { margin: 8px 0 0 0; font-size: 13px; }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .zoom-controls button {
      padding: 4px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #bbb;
      background: #f0f0f0;
      border-radius: 4px;
    }
    .zoom-controls button:hover { background: #e0e0e0; }

    .stage-wrapper {
      width: 100%;
      height: 300px;
      border: 2px solid #bbb;
      border-radius: 8px;
      background: #ffffff;
      overflow: auto;
      position: relative;
      transition: height 0.2s ease-out;
    }

    #stage { 
      display: flex; 
      align-items: flex-end; 
      justify-content: flex-start; 
      gap: 30px; 
      width: max-content;
      min-width: 100%;
      min-height: 100%;
      padding: 70px 30px 0px 30px; /* Zwiększony górny padding dla większych przycisków X */
      box-sizing: border-box;
      background: linear-gradient(to bottom, #ffffff calc(100% - 20px), #4CAF50 calc(100% - 20px), #2e7d32 100%);
      transform-origin: bottom left;
      transition: transform 0.1s ease-out;
    }
    
    .building-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      flex-shrink: 0; 
      position: relative;
      margin-bottom: 20px;
    }
    
    .building-item img { 
      display: block !important; 
      height: auto !important; 
      max-height: none !important; 
      width: auto !important; 
      max-width: none !important; 
    }
    
    /* Powiększony przycisk X */
    .remove-btn {
      position: absolute;
      top: -55px; /* Podniesiony wyżej, żeby nie zachodził na tekst */
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;  /* 2x większy */
      height: 48px; /* 2x większy */
      font-size: 26px; /* 2x większa czcionka */
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); /* Lekko mocniejszy cień */
      z-index: 10;
    }
    .remove-btn:hover { background: #cc0000; }
    
    .building-info { 
      margin-bottom: 6px; 
      font-size: 12px; 
      text-align: center; 
      background: rgba(255, 255, 255, 0.95); 
      padding: 3px 6px; 
      border-radius: 4px; 
      border: 1px solid #ccc;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>Building Size Comparison</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search building...">
    <select id="categoryFilter"><option value="">All Categories</option></select>
    <select id="countryFilter"><option value="">All Countries</option></select>
  </div>

  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-header">
    <h2>Comparison Area</h2>
    <div class="zoom-controls">
      <label><strong>Scale:</strong></label>
      <span id="zoomVal">100%</span>
      <button onclick="setZoom(1)">Reset 100%</button>
    </div>
  </div>

  <div class="stage-wrapper" id="stageWrapper">
    <div id="stage"></div>
  </div>

  <script>
    let buildingsData = [];
    let currentZoom = 1;

    async function loadData() {
      try {
        const response = await fetch('budynki.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        buildingsData = await response.json();
        initApp();
      } catch (error) {
        console.error("Błąd podczas ładowania pliku JSON:", error);
      }
    }

    function initApp() {
      setupFilters();
      renderGrid(buildingsData);
      setupScrollZoom();
    }

    function setupFilters() {
      const categories = [...new Set(buildingsData.map(b => b.category))];
      const countries = [...new Set(buildingsData.map(b => b.country))];
      
      const catSelect = document.getElementById('categoryFilter');
      catSelect.innerHTML = '<option value="">All Categories</option>';
      categories.forEach(cat => catSelect.innerHTML += `<option value="${cat}">${cat}</option>`);
      
      const countSelect = document.getElementById('countryFilter');
      countSelect.innerHTML = '<option value="">All Countries</option>';
      countries.forEach(c => countSelect.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderGrid(data) {
      const grid = document.getElementById('buildingsGrid');
      grid.innerHTML = '';
      data.forEach(b => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => addToStage(b);
        card.innerHTML = `<img src="${b.thumbnail}" alt="${b.name}"><h3>${b.name}</h3>`;
        grid.appendChild(card);
      });
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const count = document.getElementById('countryFilter').value;
      renderGrid(buildingsData.filter(b => 
        (b.name.toLowerCase().includes(search)) && (cat === '' || b.category === cat) && (count === '' || b.country === count)
      ));
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('countryFilter').addEventListener('change', filterData);

    function addToStage(building) {
      const stage = document.getElementById('stage');
      const item = document.createElement('div');
      item.className = 'building-item';

      item.innerHTML = `
        <button class="remove-btn" onclick="removeItem(this)" title="Remove building">✕</button>
        <div class="building-info"><strong>${building.name}</strong></div>
        <img src="${building.image_2d}" alt="${building.name}">
      `;
      
      stage.appendChild(item);

      const img = item.querySelector('img');
      if (img.complete) {
        updateStageHeight();
      } else {
        img.addEventListener('load', updateStageHeight);
        img.addEventListener('error', () => {
          console.error('Błąd ładowania obrazka:', building.image_2d);
        });
      }
    }

    function removeItem(btn) {
      btn.parentElement.remove();
      updateStageHeight();
    }

    function updateStageHeight() {
      const stage = document.getElementById('stage');
      const images = stage.querySelectorAll('.building-item img');
      if (images.length === 0) {
        document.querySelector('.stage-wrapper').style.height = '300px';
        return;
      }
      
      let maxHeight = 0;
      images.forEach(img => {
        if (img.offsetHeight > maxHeight) {
          maxHeight = img.offsetHeight;
        }
      });

      // Zwiększono margines błędu ze względu na wyższe przyciski X
      const calculatedHeight = (maxHeight + 100) * currentZoom + 40;
      document.querySelector('.stage-wrapper').style.height = Math.max(300, calculatedHeight) + 'px';
    }

    // Nowa funkcja obsługująca zoomowanie rolką / gładzikiem
    function setupScrollZoom() {
      const wrapper = document.getElementById('stageWrapper');
      
      wrapper.addEventListener('wheel', (e) => {
        // Blokujemy domyślne zachowanie przeglądarki (żeby strona nie jeździła w górę i dół)
        e.preventDefault(); 
        
        // Czułość powiększania
        const zoomStep = 0.05; 
        
        // e.deltaY > 0 oznacza scrollowanie w dół (oddalanie), < 0 w górę (przybliżanie)
        if (e.deltaY < 0) {
          changeZoom(zoomStep);
        } else {
          changeZoom(-zoomStep);
        }
      }, { passive: false });
    }

    function setZoom(val) {
      currentZoom = parseFloat(val);
      if (currentZoom < 0.05) currentZoom = 0.05;
      if (currentZoom > 2.5) currentZoom = 2.5; // Zwiększyłem max zoom dla wygody
      
      document.getElementById('zoomVal').innerText = Math.round(currentZoom * 100) + '%';
      document.getElementById('stage').style.transform = `scale(${currentZoom})`;
      updateStageHeight();
    }

    function changeZoom(delta) {
      setZoom(currentZoom + delta);
    }

    loadData();
  </script>
</body>
</html>
