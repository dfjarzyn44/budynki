<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Building Size Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { text-align: center; }
    
    /* Sekcja kafelków - wróciła na miejsce */
    .grid { 
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
      gap: 10px; margin-bottom: 20px; height: 150px; overflow-y: auto; 
      border: 2px solid #ccc; padding: 10px; background: #fff; 
    }
    .card { background: white; border: 1px solid #ddd; padding: 5px; text-align: center; cursor: pointer; }
    .card img { width: 100%; height: 60px; object-fit: cover; }

    /* OKNO PŁÓTNA */
    .stage-wrapper {
      width: 100%; height: 600px; border: 2px solid #333;
      background: #ffffff; overflow: hidden; position: relative; cursor: grab;
    }
    
    /* PŁÓTNO (Trawa zawsze na dole) */
    #stage { 
      display: flex; align-items: flex-end; justify-content: flex-start; 
      gap: 30px; padding: 0 30px 20px 30px;
      width: max-content; min-width: 100%; height: 100%; /* Ważne: wysokość 100% */
      background: linear-gradient(to bottom, transparent calc(100% - 20px), #4CAF50 calc(100% - 20px), #2e7d32 100%);
      transform-origin: 0 0; position: absolute; top: 0; left: 0;
    }
    
    .building-item { display: flex; flex-direction: column; align-items: center; position: relative; }
    .remove-btn { position: absolute; top: -50px; cursor: pointer; }
    .building-info { font-size: 12px; background: rgba(255,255,255,0.8); padding: 2px; }
  </style>
</head>
<body>

  <h1>Building Size Comparison</h1>
  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-wrapper" id="stageWrapper">
    <div id="stage"></div>
  </div>

  <script>
    let currentZoom = 1, panX = 0, panY = 0;
    const stage = document.getElementById('stage');
    const wrapper = document.getElementById('stageWrapper');

    // 1. Zoom na kursor
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomStep = 0.1;
      const factor = e.deltaY < 0 ? (1 + zoomStep) : (1 / (1 + zoomStep));
      const newZoom = Math.min(Math.max(currentZoom * factor, 0.2), 3);
      
      const rect = wrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newZoom / currentZoom);
      panY = mouseY - (mouseY - panY) * (newZoom / currentZoom);
      currentZoom = newZoom;
      updateTransform();
    }, { passive: false });

    // 2. Panning
    let isDown = false, startX, startY;
    wrapper.addEventListener('mousedown', (e) => {
      if (e.target.closest('.remove-btn')) return;
      isDown = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });
    window.addEventListener('mouseup', () => isDown = false);
    wrapper.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    function updateTransform() {
      stage.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    }

    // Funkcje pomocnicze
    function addToStage(building) {
      const item = document.createElement('div');
      item.className = 'building-item';
      item.innerHTML = `<button class="remove-btn" onclick="this.parentElement.remove()">✕</button><div class="building-info">${building.name}</div><img src="${building.thumbnail}">`;
      stage.appendChild(item);
    }

    // Ładowanie danych (zakładam, że masz budynki)
    async function loadData() {
        const response = await fetch('budynki.json');
        const data = await response.json();
        const grid = document.getElementById('buildingsGrid');
        data.forEach(b => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${b.thumbnail}"><div>${b.name}</div>`;
            card.onclick = () => addToStage(b);
            grid.appendChild(card);
        });
    }
    loadData();
  </script>
</body>
</html>
