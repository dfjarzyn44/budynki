<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    h1 { text-align: center; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
    input, select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; height: 350px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: #fff; border-radius: 8px; }
    .card { background: white; border: 2px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
    .card:hover { border-color: #007bff; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; background-color: #eee; }
    
    /* Zablokowany na sztywno stage, żeby nie skakał */
    #stage { 
      display: flex; 
      align-items: flex-end; 
      justify-content: flex-start; 
      gap: 20px; 
      height: 600px; 
      border-bottom: 4px solid #333; 
      padding: 10px; 
      background: #ffffff; 
      border-radius: 8px; 
      overflow-x: auto; 
      overflow-y: hidden; 
      white-space: nowrap;
    }
    .building-item { display: inline-flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    /* Obrazki mają swoje oryginalne rozmiary */
    .building-item img { display: block; }
    .building-info { margin-top: 8px; font-size: 12px; text-align: center; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>Building Size Comparison</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search building...">
    <select id="categoryFilter"><option value="">All Categories</option></select>
    <select id="countryFilter"><option value="">All Countries</option></select>
  </div>

  <div class="grid" id="buildingsGrid"></div>

  <h2>Comparison Area</h2>
  <div id="stage"></div>

  <script>
    let buildingsData = [];

    async function loadBuildings() {
      const response = await fetch('budynki.json');
      buildingsData = await response.json();
      setupFilters();
      renderGrid(buildingsData);
    }

    function setupFilters() {
      const categories = [...new Set(buildingsData.map(b => b.category))];
      const countries = [...new Set(buildingsData.map(b => b.country))];
      const catSelect = document.getElementById('categoryFilter');
      categories.forEach(cat => catSelect.innerHTML += `<option value="${cat}">${cat}</option>`);
      const countrySelect = document.getElementById('countryFilter');
      countries.forEach(c => countrySelect.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderGrid(data) {
      const grid = document.getElementById('buildingsGrid');
      grid.innerHTML = '';
      data.forEach(b => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => addToStage(b);
        card.innerHTML = `<img src="${b.thumbnail}" alt="${b.name}"><h3>${b.name}</h3><p>${b.city}</p>`;
        grid.appendChild(card);
      });
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const count = document.getElementById('countryFilter').value;
      renderGrid(buildingsData.filter(b => 
        (b.name.toLowerCase().includes(search)) && (cat === '' || b.category === cat) && (count === '' || b.country === count)
      ));
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('countryFilter').addEventListener('change', filterData);

    function addToStage(building) {
      const stage = document.getElementById('stage');
      const item = document.createElement('div');
      item.className = 'building-item';
      // Wstawiamy obrazek bez żadnych stylów height/width, czyli 1:1
      item.innerHTML = `
        <img src="${building.image_2d}" alt="${building.name}">
        <div class="building-info"><strong>${building.name}</strong></div>
      `;
      stage.appendChild(item);
    }

    loadBuildings();
  </script>
</body>
</html>
